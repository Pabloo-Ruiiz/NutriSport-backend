services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrisport-postgres
    environment:
      POSTGRES_DB: nutrisportdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d nutrisportdb"]
      interval: 5s
      retries: 10

  minio:
    # minio/minio ya no está en Docker Hub (MinIO dejó de publicar imágenes de la edición comunitaria).
    # Usamos la imagen gratuita de Chainguard, que compila MinIO desde el código fuente (AGPLv3).
    image: cgr.dev/chainguard/minio
    container_name: nutrisport-minio
    user: "0"   # la imagen usa el usuario 65532 y no podría escribir en el volumen nuevo
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit
    container_name: nutrisport-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data: