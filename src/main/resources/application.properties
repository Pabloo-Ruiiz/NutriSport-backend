spring.application.name=nutrisport-backend
logging.level.org.springframework.web=DEBUG
spring.jackson.deserialization.fail-on-unknown-properties=true
# Carga los secretos del .env de la raíz (no se sube a Git). Es opcional: si no existe,
# se usan las variables de entorno del sistema (por ejemplo, en Docker o en CI).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/nutrisportdb
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Carga las relaciones y colecciones perezosas en lotes (evita una consulta por fila en los listados)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.mvc.problemdetails.enabled=true

spring.mail.host=localhost
spring.mail.port=1025

app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutos=15
app.jwt.refresh-dias=7
app.frontend-url=http://localhost:4200
app.zona-horaria=Europe/Madrid
app.cookie.secure=true
# Versión del texto de consentimiento de datos de salud que se guarda al registrarse (RGPD art. 9)
app.consentimiento.version=2026-11

# Almacenamiento de fotos en MinIO, compatible con S3 (§5.8). Las credenciales llegan por variables de entorno.
# endpoint-publico existe porque, dentro de Docker, el backend llega a MinIO por http://minio:9000 pero el
# navegador necesita http://localhost:9000: las URLs prefirmadas se firman con el público.
app.almacenamiento.endpoint=http://localhost:9000
app.almacenamiento.endpoint-publico=http://localhost:9000
app.almacenamiento.region=us-east-1
app.almacenamiento.bucket=nutrisport-fotos
app.almacenamiento.access-key=${MINIO_USER}
app.almacenamiento.secret-key=${MINIO_PASS}
app.almacenamiento.url-minutos=5
app.almacenamiento.retencion-dias=90

# Inteligencia artificial (§4): proveedor Anthropic (Claude) con Spring AI, solo detrás de los puertos de
# com.nutrisport.ia.puerto. Sin IA_API_KEY la aplicación arranca igual y la IA funciona en modo simulado.
spring.ai.anthropic.api-key=${IA_API_KEY:sin-clave}
spring.ai.anthropic.chat.options.model=${IA_MODELO:claude-opus-5-5}
spring.ai.anthropic.timeout=${app.ia.timeout-segundos}s
# Sin reintentos en el cliente: el adaptador hace un único reintento y solo ante error de red o 5xx (§5.7)
spring.ai.anthropic.max-retries=0
# simulado | real
app.ia.modo=simulado
# Nombre del proveedor que se guarda en uso_ia en modo real
app.ia.proveedor=anthropic
app.ia.limite-analisis-diario=20
app.ia.limite-mensajes-diario=50
# Precios por millón de tokens en USD de claude-opus-5-5 (tarifa de la API de Anthropic, noviembre de 2026);
# actualízalos si cambias de modelo o de tarifa
app.ia.coste-entrada-millon=4.00
app.ia.coste-salida-millon=20.00
app.ia.timeout-segundos=20

management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
# OpenAPI y Swagger UI desactivados por defecto (producción); se activan en el perfil local (§5.3)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Tareas programadas (purga de cuentas, entrenamientos omitidos...); en los tests se desactivan
app.tareas.activas=true
