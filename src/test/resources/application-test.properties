# Perfil "test": solo para los tests de integración. Ningún valor de aquí se usa fuera de los tests.

# Secreto JWT fijo y público, válido únicamente en tests (≥ 32 caracteres para HS256)
app.jwt.secret=secreto-de-tests-nutrisport-no-usar-en-produccion-0123456789

# Las cookies de refresco no exigen HTTPS en los tests
app.cookie.secure=false

# Correo: servidor SMTP local (Mailpit); los tests no deben enviar correos reales
spring.mail.host=localhost
spring.mail.port=1025
# En los tests no hay Mailpit en marcha: sin esto, /actuator/health devolvería DOWN (503)
management.health.mail.enabled=false

logging.level.org.testcontainers=INFO

# Almacenamiento: credenciales de relleno para los tests que no extienden IntegracionBase (p. ej. @WebMvcTest)
# y no tienen MinIO. IntegracionBase las sustituye por las de su contenedor de MinIO.
app.almacenamiento.access-key=minio-tests
app.almacenamiento.secret-key=minio-tests-no-usar-en-produccion
# Sin MinIO no se comprueba ni se crea el bucket al arrancar; IntegracionBase lo activa
app.almacenamiento.inicializar-bucket=false

# Sin tareas programadas en los tests: se ejecutan a mano con su método ejecutar(...)
app.tareas.activas=false

# IA siempre simulada en los tests: nunca se llama al proveedor real ni hace falta IA_API_KEY
app.ia.modo=simulado

# Los análisis con IA se procesan en el mismo hilo, justo después del commit (sin esperas en los tests)
app.ia.async-sincrono=true

# APIs externas: URLs falsas (dominio .invalid, que nunca se resuelve) para que ningún test pueda llamar a los
# proveedores reales. Los tests de los clientes simulan el servidor y lo apuntan a su propia URL.
app.integracion.off.base-url=http://off.invalid
app.integracion.off.search-url=http://off-busqueda.invalid
app.integracion.off.user-agent=NutriSport-tests/0.1 (tests@ejemplo.com)
app.integracion.off.usuario-staging=off
app.integracion.off.clave-staging=off
app.integracion.themealdb.base-url=http://themealdb.invalid
app.integracion.themealdb.api-key=1
app.integracion.usda.base-url=http://usda.invalid
app.integracion.usda.api-key=clave-de-tests

# Cada combinación de mocks (@MockitoBean/@MockitoSpyBean) crea un contexto de Spring que se queda en caché con su
# propio pool. Con el de Hikari por defecto (10 conexiones) se superan las 100 de PostgreSQL ("too many clients").
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
